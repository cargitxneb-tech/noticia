<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 - Página no encontrada | Tu Noticias</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #1e3a8a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      flex-direction: column;
      padding: 20px;
    }
    .logo {
      font-weight: 800;
      font-size: 1.6rem;
      letter-spacing: 0.5px;
      color: #0f172a;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .container {
      max-width: 600px;
    }
    h1 {
      font-size: 5rem;
      margin: 0;
      color: #1d4ed8;
      line-height: 1;
    }
    h2 {
      font-size: 1.8rem;
      color: #0f172a;
      margin-top: 10px;
      font-weight: 700;
    }
    p {
      font-size: 1.05rem;
      color: #334155;
      margin: 15px 0 35px;
    }
    a {
      display: inline-block;
      background: linear-gradient(90deg, #1d4ed8, #2563eb);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 30px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    a:hover {
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      transform: translateY(-2px);
    }
    .subtext {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 25px;
    }
    .line {
      width: 60px;
      height: 4px;
      background-color: #1d4ed8;
      border-radius: 2px;
      margin: 16px auto 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📰 CNEBX NOTICIA</div>
    <h1>404</h1>
    <div class="line"></div>
    <h2>Página no encontrada</h2>
    <p>Lo sentimos, la página que buscas no está disponible o ha sido movida.<br>
    Te invitamos a volver a la portada para seguir informándote con las últimas noticias y reportajes.</p>
    <a href="/">Volver a la portada</a>
    <div class="subtext">Tu fuente confiable de información actual y verificada.</div>
  </div>
</body>
</html>
