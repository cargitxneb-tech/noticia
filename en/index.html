<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estamos trabajando</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #e8f0ff, #ffffff);
      font-family: Arial, Helvetica, sans-serif;
      color: #0044aa;
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      fill: #0044aa;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Icono tipo periódico -->
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
    <rect x="10" y="25" width="80" height="50" rx="6"></rect>
    <rect x="20" y="35" width="20" height="30" fill="#fff"></rect>
    <rect x="45" y="35" width="35" height="6" fill="#fff"></rect>
    <rect x="45" y="47" width="25" height="6" fill="#fff"></rect>
    <rect x="45" y="59" width="15" height="6" fill="#fff"></rect>
  </svg>

  <h1>Estamos trabajando en este espacio</h1>

</body>
</html>
